[project]
name = "librislog-backend"
version = "v0.0.0-dev"
description = "LibrisLog book tracking API"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "authlib>=1.6.5",
    "cachetools>=7.1.7",
    "cryptography>=50.0.0",
    "curl-cffi>=0.16.1",
    "fastapi-mail>=1.6.8",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "playwright>=1.62.0",
    "passlib[bcrypt]>=1.7.4",
    "pydantic-settings>=2.15.0",
    "pycountry>=24.6.1",
    "python-multipart>=0.0.32",
    "scrapling>=0.4.14",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.4",
    "browserforge>=1.2.4",
    "restrictedpython>=8.5",
    "pytest>=9.1.1",
]

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.0.3",
    "pytest-anyio>=0.0.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "error::ResourceWarning",
    "ignore::DeprecationWarning:lxml\\.html.*",
]
addopts = "-ra --cov=app --cov-report term-missing"
